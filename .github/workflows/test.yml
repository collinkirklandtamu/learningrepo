name: Tests

on: [push, pull_request]

jobs:
  lessons-and-engines:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # R is needed so the R lessons' reference solutions are verified for real
      - run: sudo apt-get update && sudo apt-get install -y r-base-core
      - run: npm ci
      - run: npm test
      # every lesson solution against the real Pyodide / WebR runtimes
      - run: node --test tests/runtime.test.js

  browser:
    runs-on: ubuntu-latest
    needs: lessons-and-engines
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright-core install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots
          path: tests/e2e/shots
